services:
  - type: web
    name: openclaw
    runtime: image
    plan: starter

    image:
      url: ghcr.io/openclaw/openclaw:2026.9.4

    dockerCommand: node openclaw.mjs gateway --allow-unconfigured --bind lan
    healthCheckPath: /startupz

    envVars:
      - key: OPENCLAW_GATEWAY_PORT
        value: "8080"

      - key: OPENCLAW_STATE_DIR
        value: /data/.openclaw

      - key: OPENCLAW_WORKSPACE_DIR
        value: /data/workspace

      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true

    disk:
      name: openclaw-data
      mountPath: /data
      sizeGB: 1
